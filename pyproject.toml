[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-nli"
version = "0.1.0"
description = "Document-level natural language inference for identity-document field verification"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stuti Arya" }]
keywords = ["nli", "entailment", "kyc", "identity-verification", "transliteration", "ocr"]

# Core deps are deliberately CPU-only and small: the whole Phase-0 pilot
# (data generation, rule baseline, evaluation) must run on a laptop with no GPU.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Neural NLI (milestone M3). Fine-tuning is designed for a GPU -- see
# notebooks/m3_colab.ipynb -- but a distilled model with frozen embeddings does
# train on a CPU in a couple of hours, which is enough to answer "does a learned
# model beat the rule engine, and where".
#
# For a CPU-only local install, take torch from the CPU index to avoid pulling
# ~2.5 GB of CUDA wheels you cannot use:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[nli]"
nli = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentencepiece>=0.2",
]
# OCR calibration (milestone M1). Pillow alone is not enough: its text drawing
# only shapes complex scripts when built against Raqm, and the standard Windows
# wheel is not, so Devanagari vowel signs do not reorder and Arabic does not
# join. Layout goes through HarfBuzz and rasterisation through FreeType.
# Tesseract itself is a system package and must be installed separately.
ocr = [
    "pillow>=10.3",
    "uharfbuzz>=0.39",
    "freetype-py>=2.4",
]
# Optional higher-fidelity transliteration backends.
translit = [
    "pypinyin>=0.51",
    "indic-transliteration>=2.3",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "nbstripout>=0.7",
]

[project.scripts]
kyc-nli = "kyc_nli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated by `kyc-nli calibrate-ocr --write-tables`; its formatting is the
# generator's business, not the linter's.
extend-exclude = ["src/kyc_nli/ocr/measured.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as call-valued defaults; B008 is a false
# positive for that idiom, not a bug to fix.
"src/kyc_nli/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
packages = ["kyc_nli"]
ignore_missing_imports = true
